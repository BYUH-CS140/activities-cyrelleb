<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="logo-container">
            <a href="index.html" class="logo-link">
                <img src="img/White_logo.png" alt="Sporting Spirits logo" class="logo" />
            </a>
        </div>
        <nav class="main-nav">
            <a href="whyvolleyball.html">Why Volleyball?</a>
            <a href="programs.html">Programs</a>
            <a href="getinvolved.html">Get Involved</a>
            <a href="keepplaying.html">Keep Playing</a>
            <a href="signup.html" class="active">Sign Up</a>
        </nav>
    </header>

    <main class="signup-container">
        <h2 class="heading">Join Our Community</h2>
        <form id="signupForm" class="signup-form" novalidate>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />

            <label for="message">Why do you want to join?</label>
            <textarea id="message" name="message"></textarea>

            <button type="submit">Sign Me Up</button>
            <p id="formMessage" class="form-message"></p>
        </form>
    </main>

    <footer>
        <div class="social">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
        <p>Images licensed from Adobe Stock</p>
        <p>&copy; 2025 Cyrelle Briz. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
